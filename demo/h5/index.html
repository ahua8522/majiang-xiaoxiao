        case "shuffle":
          this.act(() => this.session.command("shuffle"));
          break;
        case "undo":
          this.act(() => this.session.command("undo"));
          break;
        case "toggle-music":
          this.music = !this.music;
          this.persist();
          break;
        case "toggle-sound":
          this.sound = !this.sound;
          this.persist();
          break;
        case "toggle-vibration":
          this.act(() => this.session.command("toggle-vibration"));
          break;
        case "page-prev":
          this.page = Math.max(0, this.page - 1);
          break;
        case "page-next": {
          this.page = Math.min(Math.ceil(LEVELS.length / 16) - 1, this.page + 1);

    startLevel(i) {
      const idx = Math.max(0, Math.min(LEVELS.length - 1, i));
      if (!this.session.canEnter(idx)) return;
      this.act(() => {

      this.returnScreen = "home";
      this.setScreen("board");
    }
    persist() {
      this.invalidate();
    }
    /* ── board geometry ─────────────────────────────────────── */
    rows() {
      return this.session.grid.length;
    }
    cols() {
      return this.session.grid[0]?.length ?? 0;
    }
    cellAt(x, y) {
      const b = this.boardBox;
      if (!b || x < b.x || y < b.y || x > b.x + b.w || y > b.y + b.h) return null;
      const c = Math.floor((x - b.x) / (b.w / this.cols()));
      const r = Math.floor((y - b.y) / (b.h / this.rows()));
      return r >= 0 && r < this.rows() && c >= 0 && c < this.cols() ? { r, c } : null;
    }
    runAt(cell, axis) {
      return this.session.runs.findIndex((run) => run.axis === axis && run.cells.some((q) => q.r === cell.r && q.c === cell.c));
    }
    /* ── draw ───────────────────────────────────────────────── */
    draw() {
      const ctx = this.ctx;
      const dpr = this.canvas.width / (this.W * this.s);
      ctx.setTransform(this.s * dpr, 0, 0, this.s * dpr, 0, 0);
      ctx.clearRect(0, 0, this.W, this.H);
      this.hits = [];
      const bg = gardenBg(this.W, this.H);
      ctx.drawImage(bg, 0, 0, this.W, this.H);
      switch (this.screen) {
        case "home":
          this.drawHome(ctx);
          break;
        // 设置 / 选关 / 进度 / 玩法说明都是「首页上的弹框」：底图仍是首页，上面盖遮罩 + 面板
        case "levels":
          this.drawHome(ctx);
          this.drawLevels(ctx);
          break;
        case "settings":
          this.drawHome(ctx);
          this.drawSettings(ctx);
          break;
        case "progress":
          this.drawHome(ctx);
          this.drawProgress(ctx);
          break;
        case "board":
          this.drawBoard(ctx);
          break;
        case "win":
          this.drawBoard(ctx);
          this.drawWin(ctx);
          break;
        case "lose":
          this.drawBoard(ctx);
          this.drawLose(ctx);
          break;
        case "pause":
          this.drawBoard(ctx);
          this.drawPause(ctx);
          break;
        case "help":
          this.drawHome(ctx);
          this.drawHelp(ctx);
          break;
      }
      if (this.session.introTip) this.drawTipCard(ctx);
    }
    /** 「新玩法」说明卡：遮罩 + 面板 + 匾额标题 + 文案 + 知道了。展示期间牌桌输入被 Session 屏蔽。 */
    drawTipCard(ctx) {

      content.lines.forEach((ln, i) => text(ctx, ln, b.x + 56, py + padTop + 36 + i * lineH, 25, T.ink, "left"));

    push(id, b, enabled = true) {

    isPressed(id) {

    /* ══ HOME ══════════════════════════════════════════════ */

      const lv = { x: bx, y: start.y + 128, w: bw, h: 92 };

    faceIcon(ctx, cx, cy, r) {
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = "#8FBF62";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy - r * 0.16, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = "#F2D9A8";
      ctx.fill();
      ctx.fillStyle = "#2B3A28";
      ctx.beginPath();
      ctx.arc(cx - r * 0.12, cy - r * 0.2, r * 0.045, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + r * 0.12, cy - r * 0.2, r * 0.045, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy + r * 0, r * 0.09, 0.15 * Math.PI, 0.85 * Math.PI);

    }
    gearButton(ctx, b, id) {

      const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);

      g.addColorStop(1, "#1F4F2C");

      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = T.gold;
      ctx.stroke();

      ctx.fill();

      ctx.restore();
    }
    /* ══ LEVELS（首页上的弹框） ═══════════════════════════ */
    drawLevels(ctx) {
      const W = this.W;
      this.veil(ctx);
      const PER = 16, COLS = 4, gap = 20;
      const pages = Math.max(1, Math.ceil(LEVELS.length / PER));
      this.page = Math.max(0, Math.min(this.page, pages - 1));
      const count2 = Math.max(0, Math.min(PER, LEVELS.length - this.page * PER));
      const rows = Math.max(1, Math.ceil(count2 / COLS));
      const pw = W - 68;
      const cw = (pw - 80 - gap * (COLS - 1)) / COLS, chh = 110;
      const gridH = rows * chh + (rows - 1) * gap;
      const ph = 30 + 72 + 24 + 40 + gridH + 38 + 56 + 34 + 30;
      const py = this.centeredTop(ph);
      const b = { x: 34, y: py, w: pw, h: ph };
      panel(ctx, b, { r: 30 });
      const cur = { x: 34 + 40, y: py + 30, w: 300, h: 72 };
      pill(ctx, cur, "\u9009\u62E9\u5173\u5361", { size: 32, fill: "#2E6B3A", edge: T.gold, r: 36, serif: true });
      const close = { x: b.x + b.w - 96, y: py + 30, w: 58, h: 58 };
      this.push("__back", close);
      this.circleBtn(ctx, close, "close");
      const full = this.session.chapterStars(this.page) >= 48;
      text(
        ctx,
        `\u7B2C ${this.page + 1} \u7AE0 \xB7 ${CHAPTER_NAMES[this.page] || ""}\uFF08${this.page * PER + 1}-${Math.min(LEVELS.length, (this.page + 1) * PER)}\uFF09`,
        b.x + 40,
        py + 30 + 72 + 24,
        24,
        T.ink,
        "left",
        true
      );
      if (full) text(ctx, "\u5168\u4E09\u661F", b.x + b.w - 44, py + 30 + 72 + 24, 21, "#B4442F", "right", true);
      const gateBlocked = this.page > 0 && this.session.gateGap(this.page - 1) > 0;
      const gy = py + 30 + 72 + 24 + 40;
      for (let i = 0; i < count2; i++) {
        const idx = this.page * PER + i;
        const col = i % COLS, row = Math.floor(i / COLS);
        const bx = b.x + 40 + col * (cw + gap), by = gy + row * (chh + gap);
        const isCur = idx === this.session.levelIndex;
        const st = this.session.stars[String(idx)] || 0;
        const box = { x: bx, y: by, w: cw, h: chh };
        const unlocked = !gateBlocked && this.session.canEnter(idx);
        if (!unlocked) {
          fillRR(ctx, box, 18, "rgba(222,216,198,.55)");
          strokeRR(ctx, box, 18, "rgba(190,180,158,.5)", 2);
          text(ctx, String(idx + 1), bx + cw / 2, by + chh * 0.42, 36, "#B3A98F", "center", true);
          continue;
        }
        this.push("level:" + idx, box);
        const g = ctx.createLinearGradient(bx, by, bx, by + chh);
        g.addColorStop(0, "#6FC46F");
        g.addColorStop(1, "#2E7D4F");
        fillRR(ctx, { x: bx, y: by + 4, w: cw, h: chh - 4 }, 18, "#1C5B37");
        fillRR(ctx, box, 18, g);
        strokeRR(ctx, box, 18, isCur ? "#FFD84D" : "rgba(255,255,255,.35)", isCur ? 4 : 2);
        text(ctx, String(idx + 1), bx + cw / 2, by + chh * 0.32, 36, "#FFFFFF", "center", true);
        stars(ctx, bx + cw / 2, by + chh * 0.72, 12, st);
        const bm = this.session.bestMoves[String(idx)] || 0;
        const par = this.session.pars[String(idx)] || 0;
        if (bm && par && st > 0 && st < 3) {
          const line = starLines(par);
          const diff = bm - (st === 1 ? line.two : line.three);
          if (diff > 0 && diff <= 9) text(ctx, `\u5DEE${diff}\u6B65`, bx + cw - 8, by + chh * 0.3, 13, "#8C3A2E", "right", true);
        }
      }
      if (gateBlocked) {
        text(
          ctx,
          `\u4E0A\u4E00\u7AE0\u8FD8\u5DEE ${this.session.gateGap(this.page - 1)} \u661F\uFF08${this.session.chapterStars(this.page - 1)} / ${this.session.gateOf(this.page - 1)}\uFF09\u624D\u80FD\u89E3\u9501\u672C\u7AE0`,
          W / 2,
          py + ph - 92,
          21,
          "#B4442F",
          "center",
          true
        );
      }
      const pyy = py + ph - 58;
      const prev = { x: b.x + 40, y: pyy - 26, w: 70, h: 52 };
      const next = { x: b.x + b.w - 110, y: pyy - 26, w: 70, h: 52 };
      if (this.page > 0) {
        this.push("page-prev", prev);
        backChevron(ctx, prev.x + 35, pyy, 30, T.ink, 5);
      }
      if (this.page < pages - 1) {
        this.push("page-next", next);
        chevron(ctx, next.x + 35, pyy, 30, T.ink, 5);
      }
      for (let i = 0; i < pages; i++) {
        const dotX = W / 2 + (i - (pages - 1) / 2) * 26;
        ctx.beginPath();
        ctx.arc(dotX, pyy, i === this.page ? 9 : 6, 0, Math.PI * 2);
        ctx.fillStyle = i === this.page ? T.jade : "rgba(90,110,80,.4)";
        ctx.fill();
      }
    }
    lockIcon(ctx, cx, cy, r, col) {

      ctx.arc(cx, cy - r * 0.35, r * 0.45, Math.PI, 0);

      fillRR(ctx, { x: cx - r * 0.75, y: cy - r * 0.3, w: r * 1.5, h: r * 1.15 }, r * 0.25, col);
    }
    /** 连锁解锁的数字徽标（消够这个数就解锁）。 */
    badge(ctx, cx, cy, r, num) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = "#C0392B";
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * 0.18);

    /** 单向轨的箭头（画在木框边带上，方向 = 允许推动的方向）。 */

      ctx.moveTo(-size * 0.45, -size * 0.55);
      ctx.lineTo(size * 0.45, 0);
      ctx.lineTo(-size * 0.45, size * 0.55);
      ctx.stroke();
      ctx.restore();
    }
    /* ══ BOARD ═════════════════════════════════════════════ */
    drawBoard(ctx) {
      const W = this.W, H = this.H;
      const S = this.session;
      const back = { x: 26, y: 34, w: 68, h: 68 };
      this.push("back-home", back);

      const title = { x: W / 2 - 165, y: 30, w: 330, h: 76 };

      const gear = { x: W - 94, y: 34, w: 68, h: 68 };

      const left = S.total ? count(S.grid) : 0;
      const goal = S.goal;
      const goalText = goal ? goal.kind === "face" ? `\u76EE\u6807 ${Session.faceName(goal.face)} \xD7${S.goalDone}/${goal.count}` : `\u76EE\u6807 \u788E\u51B0 \xD7${S.goalDone}/${goal.count}` : null;
      text(ctx, goalText || `\u5269\u4F59 ${left} / ${S.total} \u5F20`, 40, 134, 25, goalText ? T.jadeDeep : T.ink, "left", true);
      const par = S.par || 0;
      const moveText = S.moveLimit ? `\u6B65\u6570 ${S.moves}/${S.moveLimit}` : `${S.moves} \u6B65 \xB7 \u4E09\u661F \u2264 ${S.starLines.three} \u6B65`;
      text(ctx, moveText, W - 40, 134, 25, S.moveLimit && S.movesLeft <= 3 ? "#B4442F" : T.ink, "right", true);
      const pbar = { x: 40, y: 158, w: W - 80, h: 16 };
      fillRR(ctx, pbar, 8, "rgba(60,90,50,.3)");
      const done = S.total ? (S.total - left) / S.total : 0;
      if (done > 0) {
        const g = ctx.createLinearGradient(pbar.x, pbar.y, pbar.x + pbar.w, pbar.y);

        g.addColorStop(1, "#4FA46A");

      const mg = ctx.createLinearGradient(msg.x, msg.y, msg.x, msg.y + msg.h);
      mg.addColorStop(0, "#FFF9E6");
      mg.addColorStop(1, "#F6EBCB");
      fillRR(ctx, msg, 31, mg);
      strokeRR(ctx, msg, 31, T.creamEdge, 2);
      fillRR(ctx, { x: msg.x + 22, y: msg.y + 16, w: 6, h: msg.h - 32 }, 3, T.jade);
      const line = this.drag ? (() => {
        const r = S.runs[this.drag.run];
        return `\u6B63\u5728\u5411${this.drag.axis === "row" ? this.drag.offset > 0 ? "\u53F3" : "\u5DE6" : this.drag.offset > 0 ? "\u4E0B" : "\u4E0A"}\u63A8 ${Math.max(1, Math.abs(Math.round(this.drag.offset)))} \u683C \xB7 \u677E\u624B\u6D88\u9664\u78B0\u8D77\u7684\u5BF9\u5B50`;
      })() : S.message || "\u8F7B\u70B9\u914D\u5BF9 / \u6A2A\u7AD6\u62D6\u52A8\u6574\u6BB5";
      text(ctx, fit(ctx, line, 24, msg.w - 76), msg.x + 42, msg.y + msg.h / 2, 24, T.ink, "left", false);
      const top2 = msg.y + msg.h + 18;
      const hintY = H - 214;
      const availW = W - 108, availH = hintY - 52 - top2;
      const rows = this.rows(), cols = this.cols();
      const cellW = Math.min(availW / cols, availH / rows / 1.24, 116);
      const cellH = cellW * 1.24;
      const bw = cellW * cols, bh = cellH * rows;
      const pad = Math.max(22, cellH * 0.2);
      const bx = (W - bw) / 2, by = top2 + Math.min(pad + 8, Math.max(0, (availH - bh) / 2));
      this.boardBox = { x: bx, y: by, w: bw, h: bh };
      const frame = { x: bx - pad, y: by - pad, w: bw + pad * 2, h: bh + pad * 2 };
      this.woodFrame(ctx, frame);
      ctx.save();
      rr2(ctx, frame.x, frame.y, frame.w, frame.h, 26);
      ctx.clip();
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {

            ctx.beginPath();
            ctx.moveTo(slot.x + slot.w * 0.3, slot.y + slot.h * 0.3);
            ctx.lineTo(slot.x + slot.w * 0.7, slot.y + slot.h * 0.7);
            ctx.moveTo(slot.x + slot.w * 0.7, slot.y + slot.h * 0.3);
            ctx.lineTo(slot.x + slot.w * 0.3, slot.y + slot.h * 0.7);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
      const def = levelAt(S.levelIndex);
      const tileable = (row) => !!row && row.split("").some((v) => v === "1" || v === "2" || v === "3");
      const railBar = (x, y, w, h) => {

        strokeRR(ctx, { x: x + 1, y: y + 1, w: w - 2, h: h - 2 }, 5, "rgba(60,38,14,.35)", 2);
      };
      for (const r of def.lockR) {
        if (r < 0 || r >= rows || !tileable(def.map[r])) continue;
        const cy = by + r * cellH + cellH / 2;
        railBar(bx, cy - cellH * 0.46, bw, cellH * 0.92);
        this.lockIcon(ctx, bx - pad * 0.45, cy, pad * 0.34, "#5A3F14");
      }
      for (const c of def.lockC) {
        if (c < 0 || c >= cols || !def.map.some((row) => tileable(row[c] || ""))) continue;
        const cx = bx + c * cellW + cellW / 2;
        railBar(cx - cellW * 0.46, by, cellW * 0.92, bh);
        this.lockIcon(ctx, cx, by - pad * 0.45, pad * 0.34, "#5A3F14");
      }
      for (const u of def.unlock || []) {
        if (u.after <= S.clearedPairs) continue;
        if (u.axis === "row") {
          if (u.index < 0 || u.index >= rows || !tileable(def.map[u.index])) continue;
          const cy = by + u.index * cellH + cellH / 2;
          railBar(bx, cy - cellH * 0.46, bw, cellH * 0.92);
          this.lockIcon(ctx, bx - pad * 0.45, cy, pad * 0.3, "#5A3F14");
          this.badge(ctx, bx - pad * 1.15, cy, pad * 0.34, u.after);
        } else {
          if (u.index < 0 || u.index >= cols) continue;

          this.lockIcon(ctx, cx, by - pad * 0.45, pad * 0.3, "#5A3F14");
          this.badge(ctx, cx, by - pad * 1.15, pad * 0.34, u.after);
        }
      }
      for (const o of def.oneWay || []) {

          const cy = by + o.index * cellH + cellH / 2;
          railBar(bx, cy - cellH * 0.46, bw, cellH * 0.92);
          this.railArrow(ctx, bx - pad * 0.45, cy, pad * 0.4, o.dir, "row");
          this.railArrow(ctx, bx + bw + pad * 0.45, cy, pad * 0.4, o.dir, "row");
        } else {

          if (dragRun && dragRun.cells.some((p) => p.r === r && p.c === c)) {
            const i = dragRun.cells.findIndex((p) => p.r === r && p.c === c);
            const step = this.drag.axis === "row" ? cellW : cellH;
            let off = i + this.drag.offset;
            const len = dragRun.cells.length;
            while (off > len - 1 + 0.5) off -= len;
            while (off < -0.5) off += len;
            const delta = off - i;

            drawTile(ctx, cx, cy, { face: cell[k], w: tw, h: th, lift: th * 0.08 });
            if (isTop && cell.length > 1) this.countBadge(ctx, cx + tw * 0.42, cy - th * 0.38, cell.length);
          }
        }
      }
      const hl = (p, col) => {
        const x0 = bx + p.c * cellW, y0 = by + p.r * cellH;

        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 5;
        ctx.strokeStyle = col;
        rr2(ctx, x0 + cellW * 0.04, y0 + cellH * 0.04, cellW * 0.92, cellH * 0.92, 14);
        ctx.stroke();
        ctx.restore();
      };
      if (S.selected) hl(S.selected, "#FF8A3D");
      const step0 = S.hint[0];
      if (step0) {
        if (step0.kind === "match") {
          const pulse = 0.55 + 0.45 * Math.sin((performance.now() - this.pulseStart) / 180);
          ctx.save();
          ctx.globalAlpha = Math.max(0.4, pulse);
          hl(step0.a, "#FFD84D");
          hl(step0.b, "#FFD84D");
          ctx.restore();
        } else {
          const run = S.runs[step0.run];
          if (run) {
            for (const p of run.cells) hl(p, "rgba(126,227,255,.55)");
            const dir = step0.step > 0 ? 1 : -1;
            const cells = dir > 0 ? run.cells : run.cells.slice().reverse();
            const ang = run.axis === "row" ? dir > 0 ? 0 : Math.PI : dir > 0 ? Math.PI / 2 : -Math.PI / 2;
            const elapsed = (performance.now() - this.pulseStart) / 1e3;
            cells.forEach((p, i) => {
              const a = Math.max(0, Math.min(1, (elapsed - i * 0.06) / 0.18));
              if (a <= 0) return;

              const rad = Math.min(cellW, cellH) * 0.28;
              ctx.save();
              ctx.globalAlpha = a;
              ctx.beginPath();
              ctx.arc(cx, cy, rad, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(16,44,34,.55)";
              ctx.fill();
              ctx.lineWidth = 2;

              ctx.stroke();

              ctx.restore();

      ctx.restore();
      const tools = [

        { id: "shuffle", icon: "shuffle", label: "\u6D17\u724C", sub: S.shuffleBlocked ? "\u65B9\u8A00\u6D17\u4E0D\u5F00" : S.shufflesLeft ? `\u5269 ${S.shufflesLeft} \u6B21` : "\u5DF2\u7528\u5B8C" },
        { id: "undo", icon: "undo", label: "\u64A4\u9500", sub: "\u6B65\u6570\u4E0D\u9000" },
        { id: "restart", icon: "restart", label: "\u91CD\u5F00", sub: "\u91CD\u65B0\u53D1\u724C" }
      ];
      const tw2 = (W - 68 - 3 * 16) / 4;
      const ty2 = H - 168;
      tools.forEach((t, i) => {
        const bb = { x: 34 + i * (tw2 + 16), y: ty2, w: tw2, h: 116 };
        this.push(t.id, bb);

    circleBtn(ctx, b, kind) {

      g.addColorStop(0, "#3E7A48");
      g.addColorStop(1, "#1F4F2C");

      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = T.gold;
      ctx.stroke();

        ctx.moveTo(cx + r * 0.34, cy - r * 0.34);
        ctx.lineTo(cx - r * 0.34, cy + r * 0.34);
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#F3EAD2";
        ctx.stroke();

    table(ctx, y) {

    /**

      const oSub = 76, oTile = 188, oLevel = 298, oLeft = 340, oMoves = 376, oPrimary = 486, oRow = 586, oFoot = 660;
      const ph = oFoot + 30 + 40;
      const py = this.centeredTop(ph);
      const b = { x: 84, y: py, w: W - 168, h: ph };
      panel(ctx, b, { r: 34 });
      const ban = { x: W / 2 - 214, y: py - 50, w: 428, h: 96 };
      const bg = ctx.createLinearGradient(ban.x, ban.y, ban.x, ban.y + ban.h);
      bg.addColorStop(0, "#A83B32");
      bg.addColorStop(1, "#6E211B");
      fillRR(ctx, ban, 24, bg);
      strokeRR(ctx, ban, 24, "#5A1913", 5);
      text(ctx, "\u5F88\u9057\u61BE", W / 2, ban.y + ban.h / 2, 48, "#F7DFA0", "center", true, true);
      const reasonText = S.failReason === "time" ? "\u65F6\u95F4\u5230" : S.failReason === "dead" ? "\u724C\u8D70\u6B7B\u4E86" : "\u6B65\u6570\u7528\u5C3D";
      text(ctx, reasonText, W / 2, py + oSub, 28, T.inkSoft, "center", true, true);
      drawTile(ctx, W / 2, py + oTile, { face: "5z", w: 116, h: 144 });
      text(ctx, `\u7B2C ${S.levelIndex + 1} \u5173`, W / 2, py + oLevel, 30, T.ink, "center", true);
      text(ctx, `\u5269\u4F59 ${S.remaining} / ${S.liveTotal} \u5F20`, W / 2, py + oLeft, 25, T.inkSoft, "center");
      text(ctx, `${S.moves} \u6B65 \xB7 \u4E09\u661F \u2264 ${S.starLines.three} \u6B65`, W / 2, py + oMoves, 25, T.inkSoft, "center");
      const dead = S.failReason === "dead";
      const left = Math.max(0, 2 - S.revivesUsed);
      const primary = { x: b.x + 58, y: py + oPrimary - 46, w: b.w - 116, h: 92 };
      const primaryOk = dead || S.canRevive;
      const primaryText = dead ? "\u91CD\u6392\u8FD9\u76D8\u724C" : S.failReason === "time" ? "\u8865 30 \u79D2" : `\u8865 ${S.reviveBonus} \u6B65`;
      const pid = dead ? "rescue" : "revive";
      if (primaryOk) {
        this.push(pid, primary);
        button(ctx, primary, primaryText, { kind: "jade", size: 32, pressed: this.isPressed(pid) });
      } else {
        button(ctx, primary, "\u590D\u6D3B\u6B21\u6570\u5DF2\u7528\u5B8C", { kind: "disabled", size: 32 });
      }
      if (!dead) text(ctx, `\u672C\u5173\u8FD8\u5269 ${left} \u6B21`, W / 2, py + oPrimary - 74, 22, T.inkSoft, "center");
      const half = (b.w - 116) / 2;
      const restart = { x: b.x + 58, y: py + oRow - 40, w: half, h: 80 };
      const home = { x: b.x + 58 + half + 0, y: py + oRow - 40, w: half, h: 80 };
      this.push("restart", restart);
      this.push("home", home);
      button(ctx, restart, "\u91CD\u65B0\u5F00\u59CB", { kind: "cream", size: 28, pressed: this.isPressed("restart") });
      button(ctx, home, "\u8FD4\u56DE\u9996\u9875", { kind: "cream", size: 28, pressed: this.isPressed("home") });
      text(ctx, dead ? "\u724C\u8D70\u6B7B\u4E86\u4E0D\u662F\u4F60\u7684\u9519\uFF0C\u91CD\u6392\u4E00\u6B21\u591A\u534A\u80FD\u8D70\u901A\u3002" : "\u518D\u63A5\u518D\u5389\uFF0C\u4E0B\u4E00\u6B21\u4E00\u5B9A\uFF01", W / 2, py + oFoot, 24, T.inkSoft, "center", true);
    }
    drawPause(ctx) {
      const W = this.W;
      this.veil(ctx);
      const items = [
        { id: "resume", icon: "play", label: "\u7EE7\u7EED\u6E38\u620F", kind: "jade" },
        { id: "restart", icon: "restart", label: "\u91CD\u65B0\u5F00\u59CB", kind: "cream" },
        { id: "home", icon: "home", label: "\u8FD4\u56DE\u9996\u9875", kind: "cream" }
      ];
      const oStart = 83, step = 100;
      const ph = oStart + (items.length - 1) * step + 41 + 42;
      const py = this.centeredTop(ph);
      const b = { x: 96, y: py, w: W - 192, h: ph };
      panel(ctx, b, { r: 30 });
      const ban = { x: W / 2 - 150, y: py - 42, w: 300, h: 84 };
      pill(ctx, ban, "\u5DF2\u6682\u505C", { size: 40, fill: "#2E6B3A", edge: T.gold, serif: true });
      const close = { x: b.x + b.w - 52, y: py - 30, w: 62, h: 62 };
      this.push("resume", close);
      this.circleBtn(ctx, close, "close");
      items.forEach((it, i) => {
        const bb = { x: b.x + 44, y: py + oStart + i * step - 41, w: b.w - 88, h: 82 };
        this.push(it.id, bb);
        button(ctx, bb, it.label, { kind: it.kind, size: 30, icon: it.icon, pressed: this.isPressed(it.id) });
      });
    }
    drawHelp(ctx) {
      const W = this.W;
      this.veil(ctx);
      const lines = ["\u8F7B\u70B9\u4E24\u5F20\u76F8\u90BB\u7684\u540C\u724C\uFF0C\u5373\u53EF\u6D88\u9664\u3002", "\u6309\u4F4F\u4E00\u884C\u6A2A\u62D6\u3001\u4E00\u5217\u7AD6\u62D6\uFF0C\u6574\u6BB5\u5FAA\u73AF\u6ED1\u52A8\u3002", "\u6ED1\u52A8\u677E\u624B\u540E\u4F1A\u81EA\u52A8\u6D88\u9664\u78B0\u8D77\u7684\u5BF9\u5B50\uFF0C\u53EF\u8FDE\u6D88\u3002", "\u6728\u5757\u4E0E\u7A7A\u6D1E\u4F1A\u622A\u65AD\u6ED1\u8F68\uFF1B\u9501\u4F4F\u7684\u884C / \u5217\u63A8\u4E0D\u52A8\u3002", "\u51B0\u9762\u724C\u8981\u6D88\u4E24\u6B21\uFF1A\u7B2C\u4E00\u4E0B\u788E\u51B0\uFF0C\u7B2C\u4E8C\u4E0B\u6536\u724C\u3002", "\u63D0\u793A / \u6D17\u724C\u5404\u6709\u9650\u91CF\uFF0C\u7528\u8F85\u52A9\u6700\u591A\u4E24\u661F\u3002"];
      const oLines = 150, lstep = 54;
      const oBtn = oLines + (lines.length - 1) * lstep + 16 + 40 + 43;
      const ph = oBtn + 43 + 40;
      const py = this.centeredTop(ph);
      const b = { x: 70, y: py, w: W - 140, h: ph };
      panel(ctx, b, { r: 30 });
      text(ctx, "\u73A9\u6CD5", W / 2, py + 70, 42, T.jadeDeep, "center", true, true);
      lines.forEach((s, i) => text(ctx, s, b.x + 56, py + oLines + i * lstep, 25, T.ink, "left"));
      const ok = { x: W / 2 - 170, y: py + oBtn - 43, w: 340, h: 86 };
      this.push("back-home", ok);
      button(ctx, ok, "\u77E5\u9053\u4E86", { kind: "jade", size: 30, pressed: this.isPressed("back-home") });
    }
  };

  // demo/h5/src/entry.ts
  var canvas = document.getElementById("cv");
  var app = new App(canvas);
  window.mj = app;
  window.__mjReady = true;
})();
