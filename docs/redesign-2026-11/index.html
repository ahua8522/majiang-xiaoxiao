*{box-sizing:border-box}body{margin:0;background:#edf1ea;color:var(--ink);font-family:var(--sans);font-size:14px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer;border:0}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible{outline:3px solid #e08b41;outline-offset:4px}a{color:inherit}button:active:not(:disabled){transform:translateY(2px)}
.review-shell{max-width:1370px;margin:auto;display:grid;grid-template-columns:285px 460px 245px;gap:50px;justify-content:center;padding:40px 24px;min-height:100vh;align-items:center}
.review-brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;letter-spacing:1px}
.brand-mark{display:grid;place-items:center;width:43px;height:47px;background:linear-gradient(#fffef1,#ecdfbd);border:1px solid #cdb98e;border-radius:10px;box-shadow:0 4px #457863;font:700 31px var(--serif)}
.review-brand small{display:block;font-weight:400;color:#849083;font-size:11px;margin-top:7px;letter-spacing:2px}
.review-line{font-size:10px;letter-spacing:2px;color:#8b968a;margin:44px 0 17px}
.review-nav h1{font:700 38px/1.5 var(--serif);margin:0;letter-spacing:2px}
.intro{font-size:13px;line-height:2;color:#7e8b80;margin:17px 0 31px}
.review-screen-nav{display:grid;gap:5px}
.review-screen-nav button{padding:13px 16px;text-align:left;border-radius:10px;background:transparent;display:flex;gap:19px;align-items:center;font-size:13px}
.review-screen-nav button span{font:11px Georgia,serif;color:#94a197}
.review-screen-nav button.active{background:#dae2d7;color:var(--jade);font-weight:700}
.review-screen-nav button.active:after{content:'↗';margin-left:auto}
.design-note{font-size:11px;line-height:2.2;margin-top:35px;color:#697c6f}
.design-note i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#70a478;margin-right:6px}
.design-note span{color:#95a096;font-size:10px}
.doc-link{display:inline-block;text-decoration:none;margin-top:18px;font-size:11px;border-bottom:1px solid #bfcbbd;padding-bottom:6px}
.doc-link span{margin-left:25px}
.preview-area{max-width:440px;width:100%;justify-self:center}
.preview-caption{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;margin:0 15px 14px;color:#728275}
.preview-caption span:last-child{font-size:8px;letter-spacing:2px;color:#9ba69a}
.phone{position:relative;width:390px;height:844px;margin:auto;background:var(--cream);border:7px solid #fffdf5;outline:1px solid #d7d7c9;border-radius:43px;overflow:hidden;box-shadow:0 28px 60px -24px #194c4344,0 5px 18px #605e4412;isolation:isolate}
.phone:after{content:'';position:absolute;width:104px;height:4px;border-radius:9px;background:#1e4a392a;bottom:6px;left:calc(50% - 52px);z-index:60;pointer-events:none}
.preview-footer{text-align:center;font-size:10px;color:#8f9a8e;line-height:1.7;margin-top:17px}
.annotation{align-self:center}
.small-kicker{font-size:10px;color:#95a292;letter-spacing:2px}
.annotation h2{font:700 27px/1.5 var(--serif);margin:15px 0 23px}
.annotation p{font-size:12px;line-height:1.9;color:#80907f;margin:0 0 22px}
.annotation b{font-size:12px;display:block;color:#446453;margin-bottom:4px}
.swatches{display:flex;gap:9px;margin-top:36px}
.swatches i{width:25px;height:25px;border-radius:50%;border:3px solid #ffffff88;box-shadow:0 1px 2px #0002}
.annotation .annotation-foot{margin-top:19px;font-size:10px;color:#9ca696;line-height:1.8}
#app{height:100%}
.screen{height:100%;position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;animation:arrive .25s ease-out;padding-bottom:90px;background:radial-gradient(ellipse at 75% 20%,#fffdf3 0,transparent 50%),linear-gradient(160deg,#eff4e8,#f8f9ed 64%,#e2eddc)}
.screen::-webkit-scrollbar{display:none}
.topbar{height:82px;padding:24px 21px 6px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.profile{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:40px;background:linear-gradient(#fff,#eef1de);border:1px solid #d3daca;border-radius:7px;box-shadow:0 3px 0 #46815e,0 5px 6px #26432e22;font:700 26px var(--serif);display:grid;place-items:center;transform:rotate(-5deg)}
.profile strong{font-size:12px;display:block;letter-spacing:1px}
.profile small{font-size:9px;color:#8e977e;display:block;margin-top:5px}
.currency{border:1px solid #d7c79d;border-radius:30px;background:#fff7e2b0;padding:7px 10px;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;margin-left:auto;margin-right:10px}
.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#fffef5;border:1px solid #d6dfc8;box-shadow:0 2px #cad6bc}
.icon-btn .icon{width:18px;height:18px}
.home-title{text-align:center;position:relative;z-index:2;margin-top:16px}
.eyebrow{font-size:9px;letter-spacing:3px;color:#88937b}
.home-title h2{font:900 36px/1.3 var(--sans);letter-spacing:1px;margin:12px 0 8px;color:#315f49;text-shadow:0 2px #fffef4,0 4px #c9dac0}
.home-title h2 span{font:800 27px/1.3 var(--sans);display:inline-block;letter-spacing:0;margin-left:4px;color:#4d7959}
.home-title p{font-size:10px;letter-spacing:2px;margin:0;color:#69836e}
.scene{height:260px;position:relative;margin-top:-5px;overflow:visible}
.scene>svg{position:absolute;width:100%;height:100%;inset:0;filter:drop-shadow(0 8px 7px #536d4530)}
.hero-hand{position:absolute;left:50%;top:91px;width:180px;height:130px;transform:translateX(-50%)}
.hero-tile{width:63px;height:84px;position:absolute;border-radius:7px;background:linear-gradient(118deg,#fff,#fffff6 54%,#e7ebda);border:1px solid #c3cebb;box-shadow:0 4px 0 #d6dac7,0 11px 0 #438061,2px 16px 8px #214f3d38,inset 2px 2px 1px #fff;display:grid;place-items:center}
.hero-tile img{width:82%;height:84%;object-fit:contain}
.hero-tile:nth-child(1){left:-2px;top:11px;transform:rotate(-17deg)}
.hero-tile:nth-child(2){left:55px;top:0;z-index:2;transform:rotate(-3deg)}
.hero-tile:nth-child(3){left:115px;top:9px;transform:rotate(16deg)}
.hero-hand:after{content:'';position:absolute;top:114px;left:8px;width:179px;height:22px;background:#173a3730;border-radius:50%;filter:blur(8px);z-index:-1}
.scene-tag{position:absolute;left:32px;bottom:26px;border-radius:8px;background:#fffdf1;border:1px solid #d5dec1;padding:7px 11px;font-size:10px;box-shadow:0 3px 0 #b8ccac;transform:rotate(-7deg)}
.scene-tag .icon{width:13px;height:13px;color:#b98037;margin-right:4px}
.floating-petal{position:absolute;right:39px;top:55px;color:#d39d69;font-size:24px;animation:float 4s ease-in-out infinite}
.home-content{position:relative;margin:-6px 23px 0;z-index:3}
.destination{border:1px solid #cbdcc1;border-radius:17px;background:linear-gradient(150deg,#fffef7,#edf3e3);box-shadow:0 4px 0 #bdd0af,0 9px 16px #63512510;padding:16px 17px}
.destination-top{display:flex;align-items:center;gap:9px}
.destination-top small{font-size:9px;color:#978c6d;letter-spacing:1px}
.destination-top strong{font:700 21px var(--serif);display:block;margin-top:5px}
.level-stamp{margin-left:auto;display:grid;place-items:center;border:1px dashed #baa97e;width:47px;height:47px;border-radius:50%;font:700 25px Georgia,serif;color:#427059;position:relative}
.level-stamp:after{content:'第一卷';font:8px var(--sans);position:absolute;bottom:6px}
.level-stamp span{margin-top:-7px}
.main-button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:55px;border-radius:14px;margin-top:14px;background:linear-gradient(#eda589,#d9856a);color:#fffef4;border:1px solid #c58068;box-shadow:0 5px 0 #ad6b56,inset 0 2px #ffccb1,0 7px 9px #9c66402b;font-size:19px;font-weight:700;letter-spacing:2px;text-shadow:0 1px #ad6d53}
.main-button .icon{width:17px}
.main-button small{font-size:11px;letter-spacing:0;font-weight:400;margin-left:6px;color:#ffe2c5}
.main-button.jade{background:linear-gradient(#448b72,#27634f);border-color:#205443;box-shadow:0 5px #194834,inset 0 2px #71a992;color:#fff5dc}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:19px}
.home-card{position:relative;text-align:left;padding:13px 12px 12px 47px;background:#fffef5d9;border:1px solid #d5ddc8;border-radius:13px;box-shadow:0 3px #d3ddc4;min-height:65px}
.home-card b{display:block;font-size:12px;letter-spacing:1px}
.home-card small{display:block;font-size:9px;color:#8b947e;margin-top:5px}
.home-card>.icon{position:absolute;left:12px;top:19px;width:27px;height:27px;color:#bb8b45}
.home-card:nth-child(2)>.icon{color:#739269}
.section-line{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;font-size:12px;font-weight:700;letter-spacing:1px}
.section-line small{font-size:9px;font-weight:400;color:#92987f}
.daily-strip{display:flex;align-items:center;font-size:10px;color:#78917c;gap:7px;margin:15px 3px}
.daily-strip .icon{width:13px;height:13px;color:#9aaf88}

.bottom-nav{height:73px;position:absolute;bottom:0;left:0;right:0;z-index:15;background:linear-gradient(#fcfdf4ee,#fbfcf2);border-top:1px solid #d8e2cf;display:flex;justify-content:space-around;padding:9px 12px 11px;backdrop-filter:blur(15px)}
.bottom-nav button{background:none;color:#9b9d83;font-size:9px;min-width:65px;display:flex;align-items:center;flex-direction:column;gap:4px}
.bottom-nav button .icon{width:23px;height:23px}
.bottom-nav button.active{color:var(--jade);font-weight:700}
.bottom-nav button.active:before{content:'';position:absolute;top:-2px;width:25px;height:3px;border-radius:4px;background:#478068}
.page-head{padding:9px 23px 21px}
.page-head h2{font:700 31px var(--serif);margin:8px 0 8px}
.page-head p{font-size:10px;line-height:1.8;margin:0;color:#81917e}
.backbar{display:flex;align-items:center;justify-content:space-between;padding:23px 20px 14px}

.backbar small{font-size:10px;letter-spacing:2px;color:#809780}
.board-screen{padding-bottom:20px;background:radial-gradient(ellipse at 10% 0,#fcfdf4 0,transparent 58%),linear-gradient(#eff4e9,#d8e7d6 70%,#d5e3cd)}

.board-heading{text-align:center}
.board-heading b{display:block;font:700 20px var(--serif)}

.targets{margin:0 20px;display:flex;align-items:center;gap:9px;background:#fffdf3;border-radius:13px;border:1px solid #d5dec8;box-shadow:0 4px #c6bd94;padding:11px 12px;min-height:68px}
.target{display:flex;align-items:center;gap:7px;min-width:0}
.target>.icon{color:#bc985a;width:26px;height:26px}
.target-text small{font-size:9px;color:#929479;display:block;margin-bottom:4px}

.moves{border-left:1px solid #ded3b7;margin-left:auto;padding-left:12px;text-align:center;min-width:50px}
.moves small{font-size:8px;display:block;color:#918f75}
.moves b{font:700 27px Georgia,serif;color:#436952;display:block;margin-top:2px}
.order-item{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:bold}
.order-item img{height:34px;width:25px;object-fit:contain}
.energy-bar{display:flex;align-items:center;gap:8px;margin:15px 23px 9px;font-size:9px;color:#647e64}
.energy-bar>.icon{width:17px;height:17px;color:#c39339}
.energy-dots{display:flex;gap:4px;flex:1}
.energy-dots i{height:8px;flex:1;background:#9dad8736;border-radius:3px;border:1px solid #99af8755;box-shadow:inset 0 1px 2px #4c6d2317}
.energy-dots i.lit{background:linear-gradient(#f2d58c,#d1a454);border-color:#bb974d;box-shadow:0 0 6px #d6be6870}
.energy-bar button{font-size:9px;padding:5px 8px;background:#fff6dc;border:1px solid #cbbc8a;border-radius:20px;color:#a7823e}
.energy-bar button:disabled{opacity:.5}
.table-wrap{margin:11px 17px 0;padding:15px 12px 17px;border-radius:25px;background:linear-gradient(130deg,#b2cfa7,#749d7e 45%,#88ae8a);border:2px solid #d7e6c7;box-shadow:0 7px 0 #51765b,0 11px 0 #d4dfc2,0 16px 11px #344f4530,inset 0 2px 1px #f7f8df,inset 0 -3px #668766;position:relative}
.table-wrap:before,.table-wrap:after{content:'';position:absolute;width:23px;height:23px;border:2px solid #eff1d3;border-radius:7px;top:6px;left:6px;pointer-events:none;opacity:.75}
.table-wrap:after{left:auto;right:6px}
.table-inner{background:radial-gradient(ellipse at 35% 20%,#8db68633,transparent 68%),repeating-linear-gradient(44deg,#ffffff02 0 1px,transparent 1px 3px),var(--table);border-radius:16px;padding:13px 8px 15px;border:2px solid #477354;box-shadow:inset 0 4px 7px #214e4159,0 1px #e4edce}
.board-grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:7px 5px;position:relative;touch-action:none;user-select:none}
.cell{height:58px;position:relative;display:grid;place-items:center;touch-action:none;background:#144b3d28;border-radius:9px;box-shadow:inset 0 2px 3px #12413230;padding:0;outline-offset:0}
.tile{position:absolute;inset:0 0 5px;border-radius:6px;border:1px solid #c6cbb9;background:linear-gradient(118deg,#fff,#fffff6 52%,#ececdc);box-shadow:0 2px 0 #d4d5c4,0 5px 0 #347b60,1px 8px 4px #133e3455,inset 1px 1px 1px #fff;display:grid;place-items:center;pointer-events:none;transition:transform .16s,filter .16s}
.tile img{width:85%;height:84%;object-fit:contain;pointer-events:none}
.cell.selected .tile{transform:translateY(-6px);box-shadow:0 4px #c5b482,0 7px #5aa48a,0 0 0 3px #f4d177,0 0 16px #f3d27288}
.cell.partner .tile,.cell.hinted .tile{outline:3px solid #ebca68;filter:brightness(1.07)}
.cell.hinted:after{content:'•';position:absolute;right:0;top:-8px;color:#fff4cb;background:#b98435;width:17px;height:17px;border:1px solid #fff0c4;border-radius:50%;z-index:3;line-height:14px;font-size:20px;box-shadow:0 2px 3px #0003}
.tile.iced{background:linear-gradient(125deg,#eafbff,#c7e3eb 57%,#a1c2d3);border-color:#d1ffff;box-shadow:0 3px #88b0c3,0 6px #5c95af,0 8px 4px #133f4b66}
.tile.iced:after{content:'';position:absolute;inset:3px;border:2px solid #f2ffff9c;border-radius:6px;background:linear-gradient(135deg,transparent 38%,#ffffff9c 39% 41%,transparent 42% 62%,#ffffff73 63% 65%,transparent 66%);pointer-events:none}
.cell.flower-floor{outline:2px solid #d7ba74;background:#bea05b66}
.floor-flower{position:absolute;inset:auto -1px -3px auto;z-index:2;font-size:19px;color:#e6bf71;line-height:1;text-shadow:0 1px #85551f;pointer-events:none}
.cell.bloomed{background:radial-gradient(#bfa06199,#c9af782a)}
.cell.bloomed .floor-flower{font-size:28px;inset:calc(50% - 14px) calc(50% - 14px) auto auto;color:#f3ca92;text-shadow:0 0 6px #f6d7ac}
.tile-count{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:2px;color:#d7e3bc;background:#3d7258;border:1px solid #93a474;border-radius:0 0 8px 8px;padding:3px 10px;white-space:nowrap}
.coach{display:flex;align-items:center;gap:10px;margin:29px 24px 11px;min-height:41px}
.mini-mascot{flex-shrink:0;width:28px;height:35px;background:#fffae8;border:1px solid #c3b78e;border-radius:8px;box-shadow:0 3px #4e8a68;font:700 22px var(--serif);display:grid;place-items:center;transform:rotate(-6deg)}
.coach p{font-size:10px;line-height:1.7;margin:0;color:#5c775c}
.tools{display:flex;gap:12px;justify-content:center;margin:10px 22px 0}
.tool{flex:1;max-width:90px;border:1px solid #b7b98d;border-radius:13px;background:linear-gradient(#fffdf5,#e7edda);box-shadow:0 4px #a4b28a,inset 0 1px white;display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 7px 9px;font-size:10px;position:relative}
.tool .icon{width:24px;height:24px;color:#598364}
.tool small{font-size:8px;color:#9b936b}
.board-mode-label{text-align:center;margin:15px 0 0;font-size:9px;color:#849574}
.board-mode-label button{font-size:9px;background:none;text-decoration:underline;color:#6f896b}
.map-body{position:relative;margin:0 21px;padding:2px 0 24px;min-height:470px}
.map-path{position:absolute;inset:0;width:100%;height:460px;pointer-events:none}
.map-stop{position:relative;display:flex;align-items:center;gap:15px;margin:12px 0 24px 27px;text-align:left;background:none;z-index:2}
.map-stop:nth-of-type(even){margin-left:105px}
.stop-medal{width:63px;height:66px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(#fcf4d4,#d2c494);border:3px solid #fff5db;outline:1px solid #b1ac7b;border-radius:23px;box-shadow:0 6px #688b69,0 9px 8px #33513220;font:700 27px var(--serif)}
.map-stop.done .stop-medal{background:linear-gradient(#7fb595,#4c8970);color:#fff1c8}
.map-stop b{display:block;font:700 19px var(--serif)}
.map-stop small{display:block;font-size:9px;margin-top:7px;color:#8c9c80}
.map-stop i{font-size:9px;font-style:normal;color:#b78748;display:block;margin-top:6px}
.map-foot{margin:0 22px;padding:13px 14px;border:1px dashed #cbbf9a;border-radius:12px;font-size:10px;line-height:1.7;color:#8f967f}
.workshop-list{padding:0 20px;display:grid;gap:13px}
.mechanic{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid #d5dec9;border-radius:15px;background:linear-gradient(120deg,#fffef7,#edf2e3);padding:14px;box-shadow:0 4px #cbd7bd}
.mechanic-art{width:59px;height:62px;border-radius:14px;border:1px solid #b9cfae;background:linear-gradient(#ebf5d8,#c6d9ad);display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 1px white}
.mechanic-art .icon{width:31px;height:31px;color:#548567}
.mechanic:nth-child(2) .mechanic-art{background:linear-gradient(#e5f5fb,#aacad4);border-color:#97bac7}
.mechanic:nth-child(3) .mechanic-art{background:linear-gradient(#fbe6d3,#edc39a);border-color:#debb92}
.mechanic-art img{height:46px;width:34px}
.mechanic-copy{flex:1}
.mechanic-copy h3{font:700 19px var(--serif);margin:3px 0 6px}
.mechanic-copy small{font-size:8px;color:#a0854e;letter-spacing:1px}
.mechanic-copy p{font-size:10px;color:#8c937d;margin:0;line-height:1.6}
.mechanic>.icon{color:#9ca77f;width:16px}
.future-mechanics{margin:23px 21px;padding:15px 13px;border-top:1px dashed #cebf99;font-size:10px;color:#8a937b;line-height:2}
.future-mechanics b{display:block;color:#6b8063;margin-bottom:6px}
.future-mechanics span{display:inline-block;margin-right:7px;border:1px solid #c9c9ac;padding:1px 8px;border-radius:30px;font-size:9px}
.album-scene{height:236px;margin-top:-22px}
.album-info{margin:0 23px;padding:17px;background:#fff9e7;border:1px solid #d7c79e;border-radius:15px;box-shadow:0 4px #d8cba7;position:relative}
.album-info h3{font:700 22px var(--serif);margin:0 0 8px}
.album-info p{font-size:10px;color:#8b967f;line-height:1.8;margin:0}
.theme-choices{display:flex;gap:9px;margin:15px 0 0}
.theme-choice{flex:1;border:1px solid #d0c5a7;border-radius:11px;background:#fcf5df;padding:12px 5px;font-size:9px}
.theme-choice i{width:34px;height:23px;border-radius:8px;background:var(--sample);display:block;margin:auto auto 8px;border:3px double #e2c57e;box-shadow:0 3px #99865d}
.theme-choice.active{outline:2px solid #658869;outline-offset:1px}
.stamp-row{display:flex;gap:8px;margin:15px 23px}
.stamp{flex:1;display:grid;place-items:center;width:46px;height:50px;border:1px dashed #c6b48e;border-radius:12px;color:#bcae91;font:700 20px var(--serif);transform:rotate(-4deg)}
.stamp.earned{border:2px solid #b96b52;color:#a65e44;background:#f7e4c9;transform:rotate(4deg)}
.album-caption{font-size:10px;text-align:center;color:#929c82;margin:12px 20px;line-height:1.8}
#overlay:empty{display:none}#overlay{position:absolute;inset:0;z-index:40;background:#102e2ba8;backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px}
.modal{width:100%;max-height:96%;overflow-y:auto;border:2px solid #e2c893;border-radius:23px;background:radial-gradient(ellipse at 50% 0,#fffdf1,transparent 55%),#f5f7e9;padding:23px 21px 24px;box-shadow:0 7px #c1a374,0 20px 50px #102b3755;position:relative;text-align:center;animation:arrive .22s}
.modal-close{position:absolute;right:12px;top:12px}
.modal h2{font:700 28px var(--serif);margin:15px 0 12px}
.modal p{font-size:11px;color:#899278;line-height:1.9;margin:8px 0 14px}
.modal .eyebrow{letter-spacing:2px;font-size:9px}
.win-seal{width:76px;height:81px;display:grid;place-items:center;margin:6px auto 12px;background:linear-gradient(#fffced,#e7d2a5);border:3px double #b99e62;border-radius:20px;box-shadow:0 6px #4e8568;font:700 43px var(--serif);color:#337156;transform:rotate(-7deg)}
.win-stars{display:flex;justify-content:center;gap:11px;margin:14px 0}
.win-stars .icon{width:32px;height:32px;color:#c59640;filter:drop-shadow(0 3px #e1c28a)}
.win-stats{display:flex;justify-content:center;gap:40px;margin:18px 0;padding:14px 0;border-top:1px solid #e6d5b0;border-bottom:1px solid #e6d5b0}
.win-stats span{font-size:9px;color:#9c997e}
.win-stats b{display:block;font:700 25px Georgia,serif;color:#47705c;margin-top:6px}
.text-button{background:transparent;font-size:11px;margin-top:20px;color:#88916f;text-decoration:underline;text-underline-offset:4px}
.modal-list{display:grid;gap:12px;margin:22px 0 0}
.modal-list button{padding:13px;border:1px solid #d5c19b;border-radius:10px;background:#fff8e7;box-shadow:0 3px #e2d1ab;font-size:13px}
.settings-row{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:12px;padding:15px 0;border-bottom:1px solid #e2d5b7;gap:14px}
.settings-row small{display:block;font-size:9px;color:#999a82;margin-top:5px}
.switch{width:43px;height:24px;border-radius:20px;background:#d5d2b5;position:relative}
.switch:before{content:'';width:18px;height:18px;position:absolute;top:3px;left:3px;background:#fffbeb;border-radius:50%;box-shadow:0 1px 2px #0002}
.switch.on{background:#548e70}
.switch.on:before{left:22px}
.toast{position:absolute;z-index:55;bottom:99px;left:50%;transform:translateX(-50%) translateY(8px);background:#214d41ed;border:1px solid #bbcca08c;border-radius:10px;color:#fff3d7;font-size:11px;line-height:1.7;padding:9px 14px;min-width:170px;max-width:310px;text-align:center;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.drag-line{filter:brightness(1.1)}
.board-shift .tile{transition:none}
.confetti{position:absolute;top:-12px;width:5px;height:10px;border-radius:2px;z-index:45;animation:fall 2s ease-out forwards;pointer-events:none}
.reduce-motion *{animation:none!important;transition:none!important}html{scrollbar-gutter:stable}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-7px) rotate(12deg)}}
@keyframes fall{to{transform:translate(var(--drift),820px) rotate(520deg);opacity:0}}
@media(min-width:1400px){.review-shell{gap:70px}}
@media(max-width:1150px){.review-shell{grid-template-columns:250px 430px;gap:35px}
.annotation{display:none}}
@media(max-width:800px){.review-shell{display:block;padding:20px 8px}
.review-nav{display:none}
.preview-area{margin:auto}
.preview-caption{margin-top:6px}}
@media(max-width:480px){html{scrollbar-gutter:auto}
.review-shell{padding:0}
.preview-area{max-width:none}
.preview-caption,.preview-footer{display:none}
.phone{width:100%;height:100dvh;min-height:640px;border:none;border-radius:0;outline:none;box-shadow:none}
.phone:after{display:none}
.topbar{padding-top:max(22px,env(safe-area-inset-top));height:80px}
.home-title{margin-top:12px}
.scene{height:clamp(220px,31vh,280px)}
.home-content{margin-top:-4px}
.bottom-nav{height:calc(68px + env(safe-area-inset-bottom));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.board-grid .cell{height:clamp(48px,7.2vh,65px)}
.backbar{padding-top:max(20px,env(safe-area-inset-top))}}
@media(max-height:750px) and (max-width:480px){.topbar{height:63px;padding-top:15px}
.home-title{margin-top:5px}
.home-title h2{font-size:30px}
.home-title h2 span{font-size:25px}
.scene{height:211px}
.hero-hand{top:69px;transform:translateX(-50%) scale(.9)}
.destination{padding:11px 15px}
.main-button{height:47px;margin-top:11px}
